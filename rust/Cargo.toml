[package]
name = "pocket-serve-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
reqwest = { version = "0.12", features = ["json", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
